<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 180" role="img" aria-label="Read the report"><title>Read the report</title><style>text{font-family:Georgia,serif;fill:#51432f;font-size:17px}.line{fill:none;stroke:#51432f;stroke-width:2;stroke-linejoin:round}.soft{fill:#eee7db;stroke:#96743e;stroke-width:2}.fine{fill:none;stroke:#b2a28a;stroke-width:1}.label{font-size:14px;fill:#665e52}</style><rect x="14" y="9" width="220" height="157" rx="1" fill="#fff" stroke="#d4c8b7"/><text x="30" y="32" class="label">REPORT READING GUIDE</text><path class="fine" d="M30 43H218"/><text x="30" y="65" class="label">Identity &amp; origin</text><path class="fine" d="M226 60H272"/><text x="292" y="65" text-anchor="middle" class="">1</text><text x="30" y="91" class="label">Shape &amp; dimensions</text><path class="fine" d="M226 86H272"/><text x="292" y="91" text-anchor="middle" class="">2</text><text x="30" y="117" class="label">Quality information</text><path class="fine" d="M226 112H272"/><text x="292" y="117" text-anchor="middle" class="">3</text><text x="30" y="143" class="label">Comments &amp; treatment</text><path class="fine" d="M226 138H272"/><text x="292" y="143" text-anchor="middle" class="">4</text><text x="328" y="58">Read what is stated.</text><text x="328" y="85">Ask about omissions.</text><text x="328" y="125" class="label">An explanatory diagram,</text><text x="328" y="144" class="label">not a laboratory report.</text></svg>